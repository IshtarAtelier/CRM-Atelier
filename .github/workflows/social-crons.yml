# Los tres crons de publicación en redes.
#
# Viven en GitHub Actions y no en cron-job.org por una razón práctica: el repo
# ya está acá, el alta la puede hacer cualquiera con acceso al repo (no depende
# de la cuenta personal de nadie), y queda versionado — cambiar un horario es un
# commit, no clickear en un panel que nadie recuerda.
#
# Los horarios están en UTC (ART = UTC-3) y SEPARADOS a propósito: una cuenta
# que dispara stories, feed y reportes en el mismo minuto se ve automatizada.
#   13:00 UTC = 10:00 ART → stories (4 por día)
#   14:00 UTC = 11:00 ART → carrusel del feed, si hay programado
#   21:00 UTC = 18:00 ART → mail de cadencia (después de todo lo del día)
#
# GitHub demora los schedules bastante más que "algunos minutos": lo medido en
# agosto de 2026 son 40 a 80 minutos todos los días. Para publicar en redes el
# atraso da igual, pero NO da igual quién dispara: por eso cuál cron corrió se
# lee de `github.event.schedule` y nunca del reloj (ver el paso "Elegir
# endpoint"). Cada endpoint tiene su propio dedup, así que si un run se
# repitiera, no se publica dos veces.
#
# CRON_SECRET vive en los secrets del repo (Settings → Secrets → Actions).
# workflow_dispatch permite disparar cualquiera a mano desde la pestaña Actions.

name: Social crons

on:
  # DOS disparos por cron, a 40 minutos: GitHub a veces se come un schedule
  # (paso el 7/8: el de las 13:00 nunca disparo y las stories no salieron).
  # Cada endpoint tiene dedup, asi que el segundo disparo no duplica nada:
  # si el primero anduvo, el segundo responde "ya salio hoy" y listo.
  schedule:
    - cron: '0 13 * * *'    # stories — 10:00 ART
    - cron: '40 13 * * *'   # stories, red de seguridad
    - cron: '0 14 * * *'    # feed — 11:00 ART
    - cron: '40 14 * * *'   # feed, red de seguridad
    - cron: '0 21 * * *'    # cadencia — 18:00 ART
  workflow_dispatch:
    inputs:
      cual:
        description: 'Qué cron disparar (stories | feed | cadencia)'
        required: true
        default: 'stories'
        type: choice
        options: [stories, feed, cadencia]

jobs:
  disparar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Elegir endpoint según el cron que disparó (o el input manual)
        id: cual
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CUAL="${{ inputs.cual }}"
          else
            # QUÉ CRON DISPARÓ SE LEE DEL EVENTO, NO DEL RELOJ.
            # Antes se deducía con `date -u +%H`, y eso rompió las stories: los
            # schedules de las 13:00 y 13:40 llegaron a las 14:20 y 14:40 (GitHub
            # los demora 40-80 min a diario, no "algunos minutos"), la hora ya era
            # 14, y los DOS disparos de stories llamaron al feed. El 12/8 no salió
            # ninguna story y los dos runs quedaron en verde, porque el feed
            # respondía ok:true. Los días anteriores las stories salieron de
            # rebote: los runs del feed caían en la hora 15, que no estaba en el
            # case, y el default las mandaba. Un cron atrasado tiene que hacer
            # tarde LO SUYO, nunca lo del vecino.
            case "${{ github.event.schedule }}" in
              '0 13 * * *'|'40 13 * * *') CUAL="stories" ;;
              '0 14 * * *'|'40 14 * * *') CUAL="feed" ;;
              '0 21 * * *')               CUAL="cadencia" ;;
              *)
                echo "::error::Schedule sin mapear: '${{ github.event.schedule }}'. Agregarlo al case."
                exit 1
                ;;
            esac
          fi
          case "$CUAL" in
            stories)  RUTA="social-story-diaria" ;;
            feed)     RUTA="social-feed" ;;
            cadencia) RUTA="social-cadencia" ;;
          esac
          echo "cual=$CUAL" >> "$GITHUB_OUTPUT"
          echo "ruta=$RUTA" >> "$GITHUB_OUTPUT"

      - name: Llamar el endpoint
        run: |
          echo "Disparando: ${{ steps.cual.outputs.cual }}"
          RESPUESTA=$(curl -sS --max-time 480 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://atelieroptica.com.ar/api/cron/${{ steps.cual.outputs.ruta }}")
          echo "$RESPUESTA"
          # El job falla si el endpoint reporta ok:false, para que el run quede
          # rojo en la pestaña Actions y se vea sin abrir los logs.
          echo "$RESPUESTA" | grep -q '"ok":true' || exit 1
