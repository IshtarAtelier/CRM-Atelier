name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - desarrollo
  pull_request:
    branches:
      - main
      - desarrollo

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22 y no 20: package.json pide >=22.17.0, y los chequeos de negocio
          # corren con `node --experimental-strip-types`, que no existe en 20
          # (el paso moría con "bad option" antes de ejecutar un solo check).
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # Va ANTES del lint y del build: no necesita dependencias ni base, corre en
      # segundos, y si el repo se desordenó conviene saberlo enseguida y no
      # después de esperar un build de varios minutos.
      - name: Orden del repo (dónde va cada cosa)
        run: npm run check:orden

      - name: Run ESLint
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Chequeos de negocio (factory gate + resiliencia de catálogo)
        run: |
          npm run check:gate
          npm run check:catalog

      - name: Build Next.js app
        run: npm run build
        env:
          # Este build es un CHEQUEO DE COMPILACIÓN, no el que se publica: el sitio
          # lo buildea y sirve Railway, con sus propias variables. Por eso se usa
          # la escotilla de la guarda de medición — acá no hay ids de píxel ni
          # falta que los haya. La guarda sigue cubriendo el build de Railway,
          # que es el único que hornea el HTML que ve el cliente.
          PERMITIR_BUILD_SIN_MEDICION: '1'
          # Si tienes variables de entorno requeridas para el build, asegúrate de añadirlas en GitHub Secrets
          # NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          CI: true
