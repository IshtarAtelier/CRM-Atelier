name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - desarrollo
  pull_request:
    branches:
      - main
      - desarrollo

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22 y no 20: package.json pide >=22.17.0, y los chequeos de negocio
          # corren con `node --experimental-strip-types`, que no existe en 20
          # (el paso moría con "bad option" antes de ejecutar un solo check).
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # Va ANTES del lint y del build: no necesita dependencias ni base, corre en
      # segundos, y si el repo se desordenó conviene saberlo enseguida y no
      # después de esperar un build de varios minutos.
      - name: Orden del repo (dónde va cada cosa)
        run: npm run check:orden

      # Mismo motivo que el de arriba: sin base y sin red, en segundos. Evita
      # que vuelva la clase de bug que mandaba los presupuestos con "$745,226".
      - name: La plata y las fechas, en argentino
        run: npm run check:plata

      - name: Run ESLint
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Chequeos de negocio (factory gate + resiliencia de catálogo)
        run: |
          npm run check:gate
          npm run check:catalog

      # Estos doce existían desde hacía meses y NADIE los corría: estaban en
      # package.json y en ningún workflow. Cubren plata (2x1, precios de
      # oferta), atribución de anuncios (adTag, CAPI, origen, landing),
      # comprobantes y el color del cristal. Un guardián que nadie corre no
      # guarda nada.
      #
      # Los doce son aserciones sobre el CÓDIGO y corren con lo que el CI tiene:
      # sin base, sin red y sin las dependencias de wa-service (el CI instala
      # las del package.json de la raíz, no las del bot). Comprobarlo exige
      # reproducir esas tres ausencias, no solo ver que pasen en la máquina de
      # uno: con el .env presente encuentran la base local, y con
      # wa-service/node_modules instalado cargan el bot. Por eso quedaron
      # afuera `venta-no-repricea` (consulta la base) y `bot-errores` (carga
      # wa-service/graph.js).
      - name: Chequeos de plata, atribución y catálogo
        run: |
          npm run check:promo
          npm run check:promo2x1web
          npm run check:oferta
          npm run check:comprobantes
          npm run check:adtag
          npm run check:capi
          npm run check:origen
          npm run check:landing
          npm run check:colores
          npm run check:color-lente
          npm run check:facetas
          npm run check:ficha

      # Los datos que el auto-respondedor de WhatsApp le manda a un cliente
      # (horarios, dirección, formas de pago) están duplicados en wa-service/
      # porque su Dockerfile no puede ver src/. Acá se verifica que las dos
      # copias digan lo mismo y que el texto respete las reglas de negocio.
      - name: Paridad de datos comerciales (wa-service ↔ src)
        run: npm run check:businessinfo

      - name: Tipo de lente (la adición manda, no una etiqueta)
        run: npm run check:receta

      - name: Cierres y tareas (dedup, "ya le escribí", solo tareas del vendedor)
        run: npm run check:cierres

      - name: Motor de seguimientos (compuertas antes de mandar solo)
        run: npm run check:motor

      - name: Contrato herramientas del bot ↔ rutas del CRM
        run: npm run check:contrato-bot

      - name: Prompts del bot (nada prohibido, nada obligatorio que falte)
        run: npm run check:prompt-bot

      - name: Fuera de horario el bot se prende solo (y el tilde lo frena)
        run: npm run check:horario-bot

      - name: A un hombre no se le mandan monturas de mujer
        run: npm run check:genero-fotos

      - name: Build Next.js app
        run: npm run build
        env:
          # Este build es un CHEQUEO DE COMPILACIÓN, no el que se publica: el sitio
          # lo buildea y sirve Railway, con sus propias variables. Por eso se usa
          # la escotilla de la guarda de medición — acá no hay ids de píxel ni
          # falta que los haya. La guarda sigue cubriendo el build de Railway,
          # que es el único que hornea el HTML que ve el cliente.
          PERMITIR_BUILD_SIN_MEDICION: '1'
          # Si tienes variables de entorno requeridas para el build, asegúrate de añadirlas en GitHub Secrets
          # NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          CI: true
